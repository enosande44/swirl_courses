- Class: meta
  Course: Nettoyer et analyser les données en R
  Lesson: Dates avec lubridate
  Author: Formation R
  Type: Standard
  Organization: Formation R
  Version: 1.0.0

- Class: text
  Output: Les dates doivent être converties en objets Date avant de calculer des semaines ou des intervalles.

- Class: cmd_question
  Output: Convertissez la chaîne 2024-01-15 avec ymd().
  CorrectAnswer: lubridate::ymd("2024-01-15")
  AnswerTests: expr_uses_func('ymd')
  Hint: Utilisez ymd("2024-01-15").

- Class: cmd_question
  Output: Convertissez la chaîne 15/01/2024 avec dmy().
  CorrectAnswer: lubridate::dmy("15/01/2024")
  AnswerTests: expr_uses_func('dmy')
  Hint: Utilisez dmy("15/01/2024").

- Class: cmd_question
  Output: Créez une date appelée debut égale au 15 janvier 2024 avec make_date().
  CorrectAnswer: debut <- lubridate::make_date(2024, 1, 15)
  AnswerTests: expr_uses_func('make_date')
  Hint: Utilisez make_date(année, mois, jour).

- Class: cmd_question
  Output: Extrayez l'année de debut avec year().
  CorrectAnswer: lubridate::year(debut)
  AnswerTests: expr_uses_func('year')
  Hint: Utilisez year(debut).
