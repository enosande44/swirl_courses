- Class: text
  Output: ggplot2 construit un graphique avec des données, des esthétiques, une géométrie et des étiquettes.

- Class: cmd_question
  Output: Créez df avec x égal à 1:3 et y égal à 2, 5, 4.
  CorrectAnswer: df <- data.frame(x = 1:3, y = c(2, 5, 4))
  AnswerTests: omnitest(correctExpr='df <- data.frame(x = 1:3, y = c(2, 5, 4))')
  Hint: Utilisez data.frame().

- Class: cmd_question
  Output: Créez un graphique de points avec ggplot(df, aes(x, y)) et geom_point().
  CorrectAnswer: ggplot2::ggplot(df, ggplot2::aes(x, y)) + ggplot2::geom_point()
  AnswerTests: expr_uses_func('geom_point')
  Hint: Utilisez ggplot(df, aes(x, y)) + geom_point().

- Class: cmd_question
  Output: Ajoutez un titre avec labs(title = "Valeurs de y").
  CorrectAnswer: ggplot2::ggplot(df, ggplot2::aes(x, y)) + ggplot2::geom_point() + ggplot2::labs(title = "Valeurs de y")
  AnswerTests: expr_uses_func('labs')
  Hint: Ajoutez + labs(title = "Valeurs de y").
