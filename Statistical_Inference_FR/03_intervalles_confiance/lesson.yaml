- Class: meta
  Course: Inférence statistique en français
  Lesson: Intervalles de confiance
  Author: Formation R
  Type: Standard
  Organization: Formation R
  Version: 1.0.0

- Class: text
  Output: Un intervalle de confiance décrit les valeurs compatibles avec les données et la procédure choisie.

- Class: cmd_question
  Output: Créez x contenant 8, 9, 10, 11 et 12.
  CorrectAnswer: x <- c(8, 9, 10, 11, 12)
  AnswerTests: omnitest(correctExpr='x <- c(8, 9, 10, 11, 12)')
  Hint: Utilisez c().

- Class: cmd_question
  Output: Obtenez un intervalle de confiance pour la moyenne avec t.test(x).
  CorrectAnswer: t.test(x)
  AnswerTests: omnitest(correctExpr='t.test(x)')
  Hint: Utilisez t.test(x).

- Class: text
  Output: Un intervalle à 95 % ne signifie pas que 95 % des valeurs individuelles se trouvent dans cet intervalle.
