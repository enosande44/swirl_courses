- Class: meta
  Course: Inférence statistique en français
  Lesson: Tests d'hypothèses
  Author: Formation R
  Type: Standard
  Organization: Formation R
  Version: 1.0.0

- Class: text
  Output: Un test compare les données à une hypothèse nulle et résume l'évidence avec une statistique et une p-valeur.

- Class: cmd_question
  Output: Créez x contenant 8, 9, 10, 11 et 12.
  CorrectAnswer: x <- c(8, 9, 10, 11, 12)
  AnswerTests: omnitest(correctExpr='x <- c(8, 9, 10, 11, 12)')
  Hint: Utilisez c().

- Class: cmd_question
  Output: Testez l'hypothèse selon laquelle la moyenne vaut 10.
  CorrectAnswer: t.test(x, mu = 10)
  AnswerTests: expr_uses_func('t.test')
  Hint: Utilisez t.test(x, mu = 10).

- Class: text
  Output: Une p-valeur n'est pas la probabilité que l'hypothèse nulle soit vraie. Tenez compte de l'effet et de l'incertitude.
