- Class: cmd_question
  Output: Calculez la probabilité d'obtenir au moins un succès sur 10 tirages avec pbinom().
  CorrectAnswer: 1 - pbinom(0, size = 10, prob = 0.5)
  AnswerTests: expr_uses_func('pbinom')
  Hint: Utilisez 1 - pbinom(0, 10, 0.5).
